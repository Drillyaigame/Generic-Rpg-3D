
name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  android:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configure Android SDK
        shell: bash
        run: |
          set -euo pipefail

          SDK_PATH="${ANDROID_HOME:-/usr/local/lib/android/sdk}"

          echo "ANDROID_HOME=$SDK_PATH" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_PATH" >> "$GITHUB_ENV"

          test -d "$SDK_PATH"

          SDKMANAGER="$SDK_PATH/cmdline-tools/latest/bin/sdkmanager"

          test -x "$SDKMANAGER"

          echo "SDKMANAGER=$SDKMANAGER" >> "$GITHUB_ENV"

      - name: Install Android packages
        shell: bash
        run: |
          set -euo pipefail

          "$SDKMANAGER" \
            --sdk_root="$ANDROID_HOME" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Install Godot and export templates
        shell: bash
        run: |
          set -euo pipefail

          VERSION="4.4.1"
          BASE="https://github.com/godotengine/godot/releases/download/${VERSION}-stable"

          wget -q \
            "${BASE}/Godot_v${VERSION}-stable_linux.x86_64.zip" \
            -O godot.zip

          unzip -q godot.zip

          sudo install \
            "Godot_v${VERSION}-stable_linux.x86_64" \
            /usr/local/bin/godot

          wget -q \
            "${BASE}/Godot_v${VERSION}-stable_export_templates.tpz" \
            -O templates.tpz

          unzip -q templates.tpz

          DEST="$HOME/.local/share/godot/export_templates/${VERSION}.stable"

          mkdir -p "$DEST"
          cp -a templates/. "$DEST/"

          test -f "$DEST/android_debug.apk"

          godot --version

      - name: Create debug keystore
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p "$HOME/.android"

          keytool -genkeypair \
            -keystore "$HOME/.android/debug.keystore" \
            -alias androiddebugkey \
            -storepass android \
            -keypass android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: Configure Godot
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p "$HOME/.config/godot"

          cat > "$HOME/.config/godot/editor_settings-4.4.tres" <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "$ANDROID_HOME"
          export/android/java_sdk_path = "$JAVA_HOME"
          export/android/debug_keystore = "$HOME/.android/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          EOF

      - name: Validate Android configuration
        shell: bash
        run: |
          set -euo pipefail

          test -d "$ANDROID_HOME"
          test -d "$JAVA_HOME"
          test -f "$HOME/.android/debug.keystore"
          test -f export_presets.cfg

          echo "=== Java ==="
          java -version

          echo "=== Android SDK ==="
          "$SDKMANAGER" \
            --sdk_root="$ANDROID_HOME" \
            --list_installed

          echo "=== Godot settings ==="
          cat "$HOME/.config/godot/editor_settings-4.4.tres"

          echo "=== Export preset ==="
          cat export_presets.cfg

      - name: Import assets
        shell: bash
        run: |
          set -euo pipefail

          godot --headless \
            --path . \
            --editor \
            --quit \
            2>&1 | tee import.log

          if grep -E \
            "SCRIPT ERROR|Parse Error|Failed to load script" \
            import.log; then
            exit 1
          fi

      - name: Create debug APK
        shell: bash
        run: |
          set -uo pipefail

          mkdir -p build

          godot --headless \
            --path . \
            --editor \
            --export-debug "Android" \
            build/Generic-RPG-3D.apk \
            > export.log 2>&1

          STATUS=$?

          echo "========== EXPORT LOG =========="
          cat export.log

          echo "========== ERRORS =========="
          grep -iE \
            "error|warning|invalid|missing|failed|sdk|keystore|template" \
            export.log || true

          if [ "$STATUS" -ne 0 ]; then
            echo "Android export failed."
            exit "$STATUS"
          fi

          test -s build/Generic-RPG-3D.apk

          echo "APK created successfully!"
          ls -lh build/Generic-RPG-3D.apk

      - name: Upload diagnostic logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Android-Build-Diagnostics
          path: |
            import.log
            export.log
          if-no-files-found: ignore

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Generic-RPG-3D-Android-APK
          path: build/Generic-RPG-3D.apk
          if-no-files-found: error
