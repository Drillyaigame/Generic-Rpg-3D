
name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  android:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android packages
        shell: bash
        run: |
          set -euo pipefail

          yes | sdkmanager --licenses > /dev/null || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Install Godot and export templates
        shell: bash
        run: |
          set -euo pipefail

          VERSION="4.4.1"
          BASE="https://github.com/godotengine/godot/releases/download/${VERSION}-stable"

          wget -q \
            "${BASE}/Godot_v${VERSION}-stable_linux.x86_64.zip" \
            -O godot.zip

          unzip -q godot.zip

          sudo install \
            "Godot_v${VERSION}-stable_linux.x86_64" \
            /usr/local/bin/godot

          wget -q \
            "${BASE}/Godot_v${VERSION}-stable_export_templates.tpz" \
            -O templates.tpz

          unzip -q templates.tpz

          DEST="$HOME/.local/share/godot/export_templates/${VERSION}.stable"

          mkdir -p "$DEST"
          cp -a templates/. "$DEST/"

          godot --version

          test -f "$DEST/android_debug.apk"

      - name: Create debug keystore
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p "$HOME/.android"

          keytool -genkeypair \
            -keystore "$HOME/.android/debug.keystore" \
            -alias androiddebugkey \
            -storepass android \
            -keypass android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: Configure Godot
        shell: bash
        run: |
          set -euo pipefail

          SDK_PATH="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"

          echo "ANDROID SDK: $SDK_PATH"
          echo "JAVA HOME: $JAVA_HOME"

          test -d "$SDK_PATH"
          test -f "$HOME/.android/debug.keystore"

          mkdir -p "$HOME/.config/godot"

          cat > "$HOME/.config/godot/editor_settings-4.4.tres" <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "$SDK_PATH"
          export/android/java_sdk_path = "$JAVA_HOME"
          export/android/debug_keystore = "$HOME/.android/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          EOF

      - name: Validate export preset
        shell: bash
        run: |
          set -euo pipefail

          test -f export_presets.cfg

          python3 - <<'PY'
          import configparser

          config = configparser.ConfigParser(
              interpolation=None,
              strict=False
          )

          config.read("export_presets.cfg")

          assert config.has_section("preset.0"), \
              "Missing Android preset"

          assert config.get(
              "preset.0", "name"
          ).strip('"') == "Android", \
              "Android preset name is incorrect"

          assert config.has_section("preset.0.options"), \
              "Missing Android export options"

          print("Android preset exists.")
          print("Preset validation completed.")
          PY

      - name: Import assets
        shell: bash
        run: |
          set -euo pipefail

          godot --headless \
            --path . \
            --editor \
            --quit \
            2>&1 | tee import.log

          if grep -E \
            "SCRIPT ERROR|Parse Error|Failed to load script" \
            import.log; then
            echo "Godot script errors detected."
            exit 1
          fi

      - name: Create debug APK
        shell: bash
        run: |
          set -uo pipefail

          mkdir -p build

          echo "Starting Android export..."

          godot --headless \
            --verbose \
            --path . \
            --export-debug "Android" \
            build/Generic-RPG-3D.apk \
            > export.log 2>&1

          STATUS=$?

          echo "========== EXPORT LOG =========="
          cat export.log

          echo "========== ERROR SUMMARY =========="
          grep -iE \
            "error|warning|invalid|missing|failed|keystore|sdk|template" \
            export.log || true

          if [ "$STATUS" -ne 0 ]; then
            echo "Android export failed."
            exit "$STATUS"
          fi

          if [ ! -s build/Generic-RPG-3D.apk ]; then
            echo "APK file was not created."
            exit 1
          fi

          echo "APK created successfully!"

      - name: Upload diagnostic logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Android-Build-Diagnostics
          path: |
            import.log
            export.log
          if-no-files-found: ignore

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Generic-RPG-3D-Android-APK
          path: build/Generic-RPG-3D.apk
          if-no-files-found: error
